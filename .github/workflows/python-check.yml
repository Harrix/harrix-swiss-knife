name: Python check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout harrix-swiss-knife
        uses: actions/checkout@v4
        with:
          path: harrix-swiss-knife

      - name: Checkout harrix-pylib
        uses: actions/checkout@v4
        with:
          repository: Harrix/harrix-pylib
          path: harrix-pylib

      - name: Checkout harrix-pyssg
        uses: actions/checkout@v4
        with:
          repository: Harrix/harrix-pyssg
          path: harrix-pyssg

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13
        working-directory: harrix-swiss-knife

      - name: Sync dependencies
        run: uv sync --group dev
        working-directory: harrix-swiss-knife

      - name: Ensure local config from example
        run: |
          if (!(Test-Path config/config.json)) {
            Copy-Item config/config.example.json config/config.json
          }
        working-directory: harrix-swiss-knife
        shell: pwsh

      - name: Ruff
        run: uv run ruff check src tests
        working-directory: harrix-swiss-knife

      - name: Ty
        run: uv run ty check src
        working-directory: harrix-swiss-knife

      - name: Pytest
        run: uv run pytest
        working-directory: harrix-swiss-knife
